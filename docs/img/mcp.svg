<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 350" width="920" height="350" role="img" aria-labelledby="title desc">
  <title id="title">How an MCP client logs in to kawa</title>
  <desc id="desc">1: the MCP client calls /mcp on kawa's admin port without a token. 2: kawa answers 401 with a pointer to its protected resource metadata, from which the client discovers kawa's authorization server. 3: the client opens the browser at kawa's /oauth/authorize, which sends the user to Studio's login page. 4: after the user logs in, the browser returns to the client's registered callback with a code. 5: the client exchanges the code for a token at kawa. 6: the client calls /mcp with the token and uses tools such as list_topics.</desc>
  <style>
    /* kawa-design tokens (tokens.css): dark by default, like kawa studio; light follows the viewer's theme. */
    svg {
      --bg: #020b18; --surface: #07182b; --elevated: #0c2238; --line: rgba(173, 192, 210, .13); --divider: #19344b;
      --text: #ffffff; --muted: #adc0d2;
      --accent: #22d3ee; --accent-soft: #07293a; --brand: #c9a227; --on-brand: #020b18;
      --warning: #fbbf24; --warning-soft: rgba(251, 191, 36, .08); --warning-line: rgba(251, 191, 36, .45);
      --danger: #f87171; --code: #e18bb7; --flow: rgba(173, 192, 210, .45);
      --glow-1: rgba(34, 211, 238, .10); --glow-2: rgba(201, 162, 39, .08);
    }
    @media (prefers-color-scheme: light) {
      svg {
        --bg: #eef2f7; --surface: #ffffff; --elevated: #f1f5f9; --line: rgba(11, 26, 46, .09); --divider: #dbe2ea;
        --text: #020617; --muted: #475569;
        --accent: #0891b2; --accent-soft: #e0f2fe; --brand: #f5c518; --on-brand: #0f172a;
        --warning: #b45309; --warning-soft: rgba(217, 119, 6, .07); --warning-line: rgba(217, 119, 6, .45);
        --danger: #dc2626; --code: #b0457c; --flow: rgba(71, 85, 105, .45);
        --glow-1: rgba(8, 145, 178, .07); --glow-2: rgba(245, 197, 24, .09);
      }
    }
    text { font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: var(--text); }
    .mono, .pill-t, .code { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bg { fill: var(--bg); }
    .card { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
    .row { fill: var(--elevated); stroke: var(--line); stroke-width: 1; }
    .tile { fill: var(--elevated); stroke: var(--line); stroke-width: 1; }
    .ico { fill: none; stroke: var(--accent); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .ico-warn { fill: none; stroke: var(--warning); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .brand { fill: var(--brand); }
    .brand-t { fill: var(--on-brand); font-size: 21px; font-weight: 600; }
    .h1 { font-size: 17px; font-weight: 600; }
    .h { font-size: 15px; font-weight: 600; }
    .d { font-size: 12.5px; fill: var(--muted); }
    .sec { font-size: 10.5px; font-weight: 500; letter-spacing: .09em; fill: var(--muted); }
    .sec-v { font-size: 10.5px; font-weight: 500; letter-spacing: .09em; fill: var(--accent); }
    .mono { font-size: 13.5px; }
    .code { font-size: 11px; fill: var(--code); }
    .pill { fill: var(--elevated); }
    .pill-t { font-size: 11px; fill: var(--muted); }
    .link { fill: var(--accent-soft); }
    .link-t { font-size: 11.5px; font-weight: 500; fill: var(--accent); }
    .dot { fill: var(--brand); }
    .divider { stroke: var(--divider); stroke-width: 1; }
    .knob { fill: var(--surface); stroke: var(--line); }
    .flow { fill: none; stroke: var(--flow); stroke-width: 1.5; }
    .flow-v { fill: none; stroke: var(--accent); stroke-width: 1.6; }
    .dash { fill: none; stroke: var(--flow); stroke-width: 1.4; stroke-dasharray: 4 4; }
    .deny { fill: none; stroke: var(--danger); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .deny-t { font-size: 11.5px; font-weight: 500; fill: var(--danger); }
    .warn-box { fill: var(--warning-soft); stroke: var(--warning-line); stroke-width: 1; }
    .warn-t { font-size: 11.5px; fill: var(--warning); }
    .head { fill: var(--flow); } .head-v { fill: var(--accent); } .head-d { fill: var(--danger); }
    .g1 { stop-color: var(--glow-1); } .g1-end { stop-color: var(--glow-1); stop-opacity: 0; }
    .g2 { stop-color: var(--glow-2); } .g2-end { stop-color: var(--glow-2); stop-opacity: 0; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="head-v" d="M0,0 L10,5 L0,10 z"/></marker>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 20) scale(520 300)">
      <stop offset="0" class="g1"/><stop offset="1" class="g1-end"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 230) scale(480 280)">
      <stop offset="0" class="g2"/><stop offset="1" class="g2-end"/>
    </radialGradient>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 20) scale(520 300)">
      <stop offset="0" class="g1"/><stop offset="1" class="g1-end"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 330) scale(480 280)">
      <stop offset="0" class="g2"/><stop offset="1" class="g2-end"/>
    </radialGradient>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
  </defs>

  <rect class="bg" width="920" height="350" rx="18"/>
  <rect fill="url(#glow1)" width="920" height="350" rx="18"/>
  <rect fill="url(#glow2)" width="920" height="350" rx="18"/>

  <!-- MCP client -->
  <rect class="card" x="28" y="60" width="200" height="220" rx="16"/>
  <rect class="tile" x="46" y="78" width="36" height="36" rx="10"/>
  <use href="#i-monitor" class="ico" x="54" y="86" width="20" height="20"/>
  <text class="h" x="94" y="101">MCP client</text>
  <text class="d" x="46" y="140">Claude Code or</text>
  <text class="d" x="46" y="158">another MCP client</text>
  <line class="divider" x1="46" y1="178" x2="210" y2="178"/>
  <text class="sec" x="46" y="200">CLIENT ID</text>
  <rect class="pill" x="46" y="208" width="128" height="20" rx="6"/>
  <text class="pill-t" x="54" y="222">kawa-mcp-claude</text>
  <text class="sec" x="46" y="250">CALLBACK</text>
  <text class="code" x="46" y="268">localhost:*/callback</text>

  <!-- gateway -->
  <rect class="card" x="372" y="60" width="240" height="220" rx="16"/>
  <rect class="brand" x="392" y="78" width="36" height="36" rx="10"/>
  <text class="brand-t" x="410" y="103" text-anchor="middle" style="font-size: 19px">川</text>
  <text class="h" x="440" y="93">kawa gateway</text>
  <rect class="pill" x="440" y="100" width="82" height="18" rx="6"/>
  <text class="pill-t" x="447" y="113">admin port</text>
  <line class="divider" x1="392" y1="132" x2="592" y2="132"/>
  <rect class="row" x="392" y="144" width="200" height="28" rx="8"/>
  <text class="code" x="404" y="162">/mcp</text><text class="d" x="444" y="162">MCP server</text>
  <rect class="row" x="392" y="180" width="200" height="28" rx="8"/>
  <text class="code" x="404" y="198">/oauth</text><text class="d" x="456" y="198">login and tokens</text>
  <rect class="row" x="392" y="216" width="200" height="28" rx="8"/>
  <text class="code" x="404" y="234">/.well-known</text><text class="d" x="498" y="234">discovery</text>
  <text class="d" x="392" y="266">tools: <tspan class="code">list_topics</tspan></text>

  <!-- Studio -->
  <rect class="card" x="724" y="60" width="168" height="220" rx="16"/>
  <rect class="tile" x="742" y="78" width="36" height="36" rx="10"/>
  <use href="#i-lock" class="ico" x="750" y="86" width="20" height="20"/>
  <text class="h" x="790" y="101">Studio</text>
  <text class="d" x="742" y="140">login page</text>
  <text class="d" x="742" y="158">in the browser:</text>
  <text class="d" x="742" y="176">email and password</text>
  <text class="d" x="742" y="194">of an admin user</text>

  <!-- 1, 2, 3, 5, 6: client and kawa -->
  <text class="link-t" x="240" y="110">1</text><text class="pill-t" x="252" y="110">POST /mcp</text>
  <path class="flow-v" d="M232,116 H368" marker-end="url(#av)"/>
  <text class="link-t" x="240" y="144">2</text><text class="pill-t" x="252" y="144">401 + metadata</text>
  <path class="flow-v" d="M368,150 H232" marker-end="url(#av)"/>
  <text class="link-t" x="240" y="178">3</text><text class="pill-t" x="252" y="178">/oauth/authorize</text>
  <path class="flow-v" d="M232,184 H368" marker-end="url(#av)"/>
  <text class="link-t" x="240" y="220">5</text><text class="pill-t" x="252" y="220">code → token</text>
  <path class="flow-v" d="M232,226 H368" marker-end="url(#av)"/>
  <text class="link-t" x="240" y="254">6</text><text class="pill-t" x="252" y="254">/mcp + token</text>
  <path class="flow-v" d="M232,260 H368" marker-end="url(#av)"/>

  <!-- 3: kawa to Studio -->
  <text class="pill-t" x="626" y="178">login page</text>
  <path class="flow-v" d="M616,184 H720" marker-end="url(#av)"/>

  <!-- 4: Studio back to the client's callback -->
  <path class="flow-v" d="M808,284 V318 H128 V284" marker-end="url(#av)"/>
  <text class="link-t" x="336" y="310">4</text><text class="pill-t" x="348" y="310">back to the client's callback, with a code</text>
</svg>
