<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 296" width="920" height="296" role="img" aria-labelledby="title desc">
  <title id="title">Governance on the Kafka protocol</title>
  <desc id="desc">Any Kafka client goes through the kawa gateway, which checks each request against the governance rules. AdminClient creating orders.created passes the topic-domains rule and reaches the cluster. Terraform creating inventory.stock breaks the rule, gets a policy error back, and the request never reaches the broker. A consumer joining group billing-invoices passes the group-prefix rule.</desc>
  <style>
    /* kawa-design tokens (tokens.css): dark by default, like kawa studio; light follows the viewer's theme. */
    svg {
      --bg: #020b18; --surface: #07182b; --elevated: #0c2238; --line: rgba(173, 192, 210, .13); --divider: #19344b;
      --text: #ffffff; --muted: #adc0d2;
      --accent: #22d3ee; --accent-soft: #07293a; --brand: #c9a227; --on-brand: #020b18;
      --warning: #fbbf24; --warning-soft: rgba(251, 191, 36, .08); --warning-line: rgba(251, 191, 36, .45);
      --danger: #f87171; --code: #e18bb7; --flow: rgba(173, 192, 210, .45);
      --glow-1: rgba(34, 211, 238, .10); --glow-2: rgba(201, 162, 39, .08);
    }
    @media (prefers-color-scheme: light) {
      svg {
        --bg: #eef2f7; --surface: #ffffff; --elevated: #f1f5f9; --line: rgba(11, 26, 46, .09); --divider: #dbe2ea;
        --text: #020617; --muted: #475569;
        --accent: #0891b2; --accent-soft: #e0f2fe; --brand: #f5c518; --on-brand: #0f172a;
        --warning: #b45309; --warning-soft: rgba(217, 119, 6, .07); --warning-line: rgba(217, 119, 6, .45);
        --danger: #dc2626; --code: #b0457c; --flow: rgba(71, 85, 105, .45);
        --glow-1: rgba(8, 145, 178, .07); --glow-2: rgba(245, 197, 24, .09);
      }
    }
    text { font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: var(--text); }
    .mono, .pill-t, .code { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bg { fill: var(--bg); }
    .card { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
    .row { fill: var(--elevated); stroke: var(--line); stroke-width: 1; }
    .tile { fill: var(--elevated); stroke: var(--line); stroke-width: 1; }
    .ico { fill: none; stroke: var(--accent); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .ico-warn { fill: none; stroke: var(--warning); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .brand { fill: var(--brand); }
    .brand-t { fill: var(--on-brand); font-size: 21px; font-weight: 600; }
    .h1 { font-size: 17px; font-weight: 600; }
    .h { font-size: 15px; font-weight: 600; }
    .d { font-size: 12.5px; fill: var(--muted); }
    .sec { font-size: 10.5px; font-weight: 500; letter-spacing: .09em; fill: var(--muted); }
    .sec-v { font-size: 10.5px; font-weight: 500; letter-spacing: .09em; fill: var(--accent); }
    .mono { font-size: 13.5px; }
    .code { font-size: 11px; fill: var(--code); }
    .pill { fill: var(--elevated); }
    .pill-t { font-size: 11px; fill: var(--muted); }
    .link { fill: var(--accent-soft); }
    .link-t { font-size: 11.5px; font-weight: 500; fill: var(--accent); }
    .dot { fill: var(--brand); }
    .divider { stroke: var(--divider); stroke-width: 1; }
    .knob { fill: var(--surface); stroke: var(--line); }
    .flow { fill: none; stroke: var(--flow); stroke-width: 1.5; }
    .flow-v { fill: none; stroke: var(--accent); stroke-width: 1.6; }
    .dash { fill: none; stroke: var(--flow); stroke-width: 1.4; stroke-dasharray: 4 4; }
    .deny { fill: none; stroke: var(--danger); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .deny-t { font-size: 11.5px; font-weight: 500; fill: var(--danger); }
    .warn-box { fill: var(--warning-soft); stroke: var(--warning-line); stroke-width: 1; }
    .warn-t { font-size: 11.5px; fill: var(--warning); }
    .head { fill: var(--flow); } .head-v { fill: var(--accent); } .head-d { fill: var(--danger); }
    .g1 { stop-color: var(--glow-1); } .g1-end { stop-color: var(--glow-1); stop-opacity: 0; }
    .g2 { stop-color: var(--glow-2); } .g2-end { stop-color: var(--glow-2); stop-opacity: 0; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="head-v" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="head-d" d="M0,0 L10,5 L0,10 z"/></marker>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 20) scale(520 300)">
      <stop offset="0" class="g1"/><stop offset="1" class="g1-end"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 286) scale(480 280)">
      <stop offset="0" class="g2"/><stop offset="1" class="g2-end"/>
    </radialGradient>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></symbol>
  </defs>

  <rect class="bg" width="920" height="296" rx="18"/>
  <rect fill="url(#glow1)" width="920" height="296" rx="18"/>
  <rect fill="url(#glow2)" width="920" height="296" rx="18"/>

  <!-- clients -->
  <rect class="card" x="28" y="26" width="250" height="244" rx="16"/>
  <rect class="tile" x="46" y="44" width="36" height="36" rx="10"/>
  <use href="#i-monitor" class="ico" x="54" y="52" width="20" height="20"/>
  <text class="h" x="94" y="59">Any Kafka client</text>
  <text class="d" x="94" y="76">CLI, Terraform, apps, Streams</text>
  <line class="divider" x1="46" y1="92" x2="260" y2="92"/>
  <rect class="row" x="46" y="104" width="214" height="44" rx="10"/>
  <text class="d" x="60" y="121" style="font-size: 11.5px">AdminClient · create topic</text>
  <text class="mono" x="60" y="139">orders.created</text>
  <rect class="row" x="46" y="156" width="214" height="44" rx="10"/>
  <text class="d" x="60" y="173" style="font-size: 11.5px">Terraform · create topic</text>
  <text class="mono" x="60" y="191">inventory.stock</text>
  <rect class="row" x="46" y="208" width="214" height="44" rx="10"/>
  <text class="d" x="60" y="225" style="font-size: 11.5px">consumer app · join group</text>
  <text class="mono" x="60" y="243">billing-invoices</text>

  <!-- gateway -->
  <rect class="card" x="330" y="26" width="290" height="244" rx="16"/>
  <rect class="brand" x="348" y="44" width="36" height="36" rx="10"/>
  <text class="brand-t" x="366" y="69" text-anchor="middle" style="font-size: 19px">川</text>
  <text class="h" x="396" y="59">kawa gateway</text>
  <text class="d" x="396" y="76">rules on the Kafka protocol</text>
  <line class="divider" x1="348" y1="92" x2="602" y2="92"/>
  <rect class="row" x="348" y="104" width="254" height="44" rx="10"/>
  <text class="mono" x="362" y="131">topic-domains</text>
  <rect class="pill" x="508" y="116" width="82" height="20" rx="6"/>
  <circle class="dot" cx="519" cy="126" r="3"/><text class="pill-t" x="528" y="130">allowed</text>
  <rect class="row" x="348" y="156" width="254" height="44" rx="10"/>
  <text class="mono" x="362" y="183">topic-domains</text>
  <rect class="warn-box" x="508" y="168" width="82" height="20" rx="6" style="stroke: var(--danger); fill: none"/>
  <text class="deny-t" x="520" y="182">refused</text>
  <rect class="row" x="348" y="208" width="254" height="44" rx="10"/>
  <text class="mono" x="362" y="235">group-prefix</text>
  <rect class="pill" x="508" y="220" width="82" height="20" rx="6"/>
  <circle class="dot" cx="519" cy="230" r="3"/><text class="pill-t" x="528" y="234">allowed</text>

  <!-- cluster -->
  <rect class="card" x="688" y="26" width="204" height="244" rx="16"/>
  <rect class="tile" x="706" y="44" width="36" height="36" rx="10"/>
  <use href="#i-database" class="ico" x="714" y="52" width="20" height="20"/>
  <text class="h" x="754" y="59">Kafka cluster</text>
  <text class="d" x="754" y="76">only compliant requests</text>
  <line class="divider" x1="706" y1="92" x2="874" y2="92"/>
  <rect class="row" x="706" y="104" width="168" height="44" rx="10"/>
  <text class="mono" x="720" y="131">orders.created</text>
  <rect x="706" y="156" width="168" height="44" rx="10" class="deny"/>
  <text class="deny-t" x="720" y="174">never reaches</text>
  <text class="deny-t" x="720" y="190">the broker</text>
  <rect class="row" x="706" y="208" width="168" height="44" rx="10"/>
  <text class="mono" x="720" y="235">billing-invoices</text>

  <path class="flow" d="M606,126 H702" marker-end="url(#a)"/>
  <path class="flow-v" d="M264,126 H344" marker-end="url(#av)"/>
  <path class="deny" d="M344,186 H268" marker-end="url(#ad)"/>
  <text class="deny-t" x="306" y="202" text-anchor="middle" style="font-size: 10px">policy error</text>
  <path class="flow-v" d="M264,172 H344" marker-end="url(#av)"/>
  <path class="flow" d="M606,230 H702" marker-end="url(#a)"/>
  <path class="flow-v" d="M264,230 H344" marker-end="url(#av)"/>
</svg>
