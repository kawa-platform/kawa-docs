<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="920" height="360" role="img" aria-labelledby="title desc">
  <title id="title">kawa components on Kubernetes</title>
  <desc id="desc">Kafka clients connect to the kawa gateway on port 9092. The platform team uses Studio in a browser; Studio calls the gateway's admin API on port 8080. The operator turns VirtualTopic, Client, Role and Group resources into admin API calls. The kawa Helm chart installs the gateway and Studio, the kawa-operator chart installs the operator. The gateway talks to the Kafka cluster, where it also keeps its configuration in the config topic __kawa.</desc>
  <style>
    /* kawa-design tokens (tokens.css): dark by default, like kawa studio; light follows the viewer's theme. */
    svg {
      --bg: #020b18; --surface: #07182b; --elevated: #0c2238; --line: rgba(173, 192, 210, .13); --divider: #19344b;
      --text: #ffffff; --muted: #adc0d2;
      --accent: #22d3ee; --accent-soft: #07293a; --brand: #c9a227; --on-brand: #020b18;
      --warning: #fbbf24; --warning-soft: rgba(251, 191, 36, .08); --warning-line: rgba(251, 191, 36, .45);
      --danger: #f87171; --code: #e18bb7; --flow: rgba(173, 192, 210, .45);
      --glow-1: rgba(34, 211, 238, .10); --glow-2: rgba(201, 162, 39, .08);
    }
    @media (prefers-color-scheme: light) {
      svg {
        --bg: #eef2f7; --surface: #ffffff; --elevated: #f1f5f9; --line: rgba(11, 26, 46, .09); --divider: #dbe2ea;
        --text: #020617; --muted: #475569;
        --accent: #0891b2; --accent-soft: #e0f2fe; --brand: #f5c518; --on-brand: #0f172a;
        --warning: #b45309; --warning-soft: rgba(217, 119, 6, .07); --warning-line: rgba(217, 119, 6, .45);
        --danger: #dc2626; --code: #b0457c; --flow: rgba(71, 85, 105, .45);
        --glow-1: rgba(8, 145, 178, .07); --glow-2: rgba(245, 197, 24, .09);
      }
    }
    text { font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: var(--text); }
    .mono, .pill-t, .code { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bg { fill: var(--bg); }
    .card { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
    .row { fill: var(--elevated); stroke: var(--line); stroke-width: 1; }
    .tile { fill: var(--elevated); stroke: var(--line); stroke-width: 1; }
    .ico { fill: none; stroke: var(--accent); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .ico-warn { fill: none; stroke: var(--warning); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .brand { fill: var(--brand); }
    .brand-t { fill: var(--on-brand); font-size: 21px; font-weight: 600; }
    .h1 { font-size: 17px; font-weight: 600; }
    .h { font-size: 15px; font-weight: 600; }
    .d { font-size: 12.5px; fill: var(--muted); }
    .sec { font-size: 10.5px; font-weight: 500; letter-spacing: .09em; fill: var(--muted); }
    .sec-v { font-size: 10.5px; font-weight: 500; letter-spacing: .09em; fill: var(--accent); }
    .mono { font-size: 13.5px; }
    .code { font-size: 11px; fill: var(--code); }
    .pill { fill: var(--elevated); }
    .pill-t { font-size: 11px; fill: var(--muted); }
    .link { fill: var(--accent-soft); }
    .link-t { font-size: 11.5px; font-weight: 500; fill: var(--accent); }
    .dot { fill: var(--brand); }
    .divider { stroke: var(--divider); stroke-width: 1; }
    .knob { fill: var(--surface); stroke: var(--line); }
    .flow { fill: none; stroke: var(--flow); stroke-width: 1.5; }
    .flow-v { fill: none; stroke: var(--accent); stroke-width: 1.6; }
    .dash { fill: none; stroke: var(--flow); stroke-width: 1.4; stroke-dasharray: 4 4; }
    .deny { fill: none; stroke: var(--danger); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .deny-t { font-size: 11.5px; font-weight: 500; fill: var(--danger); }
    .warn-box { fill: var(--warning-soft); stroke: var(--warning-line); stroke-width: 1; }
    .warn-t { font-size: 11.5px; fill: var(--warning); }
    .head { fill: var(--flow); } .head-v { fill: var(--accent); } .head-d { fill: var(--danger); }
    .g1 { stop-color: var(--glow-1); } .g1-end { stop-color: var(--glow-1); stop-opacity: 0; }
    .g2 { stop-color: var(--glow-2); } .g2-end { stop-color: var(--glow-2); stop-opacity: 0; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="head-v" d="M0,0 L10,5 L0,10 z"/></marker>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 20) scale(520 300)">
      <stop offset="0" class="g1"/><stop offset="1" class="g1-end"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 350) scale(480 280)">
      <stop offset="0" class="g2"/><stop offset="1" class="g2-end"/>
    </radialGradient>
    <symbol id="i-monitor" viewBox="0 0 24 24"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-layout" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></symbol>
    <symbol id="i-cog" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></symbol>
    <symbol id="i-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/></symbol>
  </defs>

  <rect class="bg" width="920" height="360" rx="18"/>
  <rect fill="url(#glow1)" width="920" height="360" rx="18"/>
  <rect fill="url(#glow2)" width="920" height="360" rx="18"/>

  <!-- left: who uses kawa -->
  <rect class="card" x="28" y="58" width="168" height="96" rx="16"/>
  <rect class="tile" x="46" y="76" width="36" height="36" rx="10"/>
  <use href="#i-monitor" class="ico" x="54" y="84" width="20" height="20"/>
  <text class="h" x="94" y="91">Kafka clients</text>
  <text class="d" x="94" y="108">apps, Streams,</text>
  <text class="d" x="94" y="124">Terraform, CLIs</text>

  <rect class="card" x="28" y="210" width="168" height="96" rx="16"/>
  <rect class="tile" x="46" y="228" width="36" height="36" rx="10"/>
  <use href="#i-user" class="ico" x="54" y="236" width="20" height="20"/>
  <text class="h" x="94" y="243">Platform team</text>
  <text class="d" x="94" y="260">browser: Studio</text>
  <text class="d" x="94" y="276">git: resources</text>

  <!-- kubernetes -->
  <rect x="226" y="20" width="460" height="320" rx="18" class="dash"/>
  <text class="sec" x="246" y="42">KUBERNETES</text>
  <text class="sec-v" x="246" y="326">CHART  kawa</text>
  <line class="divider" x1="246" y1="314" x2="496" y2="314"/>
  <text class="sec-v" x="516" y="326">CHART  kawa-operator</text>
  <line class="divider" x1="516" y1="314" x2="668" y2="314"/>

  <!-- chart kawa: gateway + studio -->
  <rect class="card" x="246" y="58" width="250" height="104" rx="16"/>
  <rect class="brand" x="264" y="76" width="36" height="36" rx="10"/>
  <text class="brand-t" x="282" y="101" text-anchor="middle" style="font-size: 19px">川</text>
  <text class="h" x="312" y="91">kawa gateway</text>
  <text class="d" x="312" y="108">the Kafka endpoint</text>
  <rect class="pill" x="264" y="126" width="92" height="20" rx="6"/>
  <circle class="dot" cx="275" cy="136" r="3"/><text class="pill-t" x="284" y="140">:9092 kafka</text>
  <rect class="pill" x="364" y="126" width="114" height="20" rx="6"/>
  <circle class="dot" cx="375" cy="136" r="3"/><text class="pill-t" x="384" y="140">:8080 admin api</text>

  <rect class="card" x="246" y="210" width="250" height="96" rx="16"/>
  <rect class="tile" x="264" y="228" width="36" height="36" rx="10"/>
  <use href="#i-layout" class="ico" x="272" y="236" width="20" height="20"/>
  <text class="h" x="312" y="243">Studio</text>
  <text class="d" x="312" y="260">web admin UI</text>
  <text class="d" x="264" y="288">topics, clients, roles, rules</text>

  <!-- chart kawa-operator -->
  <rect class="card" x="516" y="210" width="152" height="96" rx="16"/>
  <rect class="tile" x="534" y="228" width="36" height="36" rx="10"/>
  <use href="#i-cog" class="ico" x="542" y="236" width="20" height="20"/>
  <text class="h" x="582" y="251">Operator</text>
  <text class="d" x="534" y="282">VirtualTopic, Client,</text>
  <text class="d" x="534" y="298">Role, Group</text>

  <!-- kafka cluster -->
  <rect class="card" x="720" y="58" width="172" height="248" rx="16"/>
  <rect class="tile" x="738" y="76" width="36" height="36" rx="10"/>
  <use href="#i-database" class="ico" x="746" y="84" width="20" height="20"/>
  <text class="h" x="786" y="99">Kafka cluster</text>
  <line class="divider" x1="738" y1="126" x2="874" y2="126"/>
  <rect class="row" x="738" y="138" width="136" height="34" rx="10"/>
  <text class="mono" x="752" y="160">your topics</text>
  <rect class="row" x="738" y="182" width="136" height="44" rx="10"/>
  <text class="mono" x="752" y="201">__kawa</text>
  <text class="d" x="752" y="217" style="font-size: 10.5px">kawa's config topic</text>
  <text class="d" x="738" y="254">unchanged; sees one</text>
  <text class="d" x="738" y="270">service identity</text>

  <!-- flows -->
  <path class="flow-v" d="M200,106 H242" marker-end="url(#av)"/>
  <path class="flow-v" d="M200,258 H242" marker-end="url(#av)"/>
  <path class="flow-v" d="M371,206 V166" marker-end="url(#av)"/>
  <path class="flow-v" d="M592,206 C592,150 560,120 500,116" marker-end="url(#av)"/>
  <path class="flow" d="M500,106 H716" marker-end="url(#a)"/>
</svg>
