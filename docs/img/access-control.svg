<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 262" width="920" height="262" role="img" aria-labelledby="title desc">
  <title id="title">Clients, groups and roles</title>
  <desc id="desc">The client alice is in the group producers, which has the role orders-producer: WRITE on topic orders. The client bob is in the group admins, which has the role admin: CREATE and DELETE on the cluster. Everything else is denied, and a matching DENY always wins.</desc>
  <style>
    /* kawa-design tokens (tokens.css): dark by default, like kawa studio; light follows the viewer's theme. */
    svg {
      --bg: #020b18; --surface: #07182b; --elevated: #0c2238; --line: rgba(173, 192, 210, .13); --divider: #19344b;
      --text: #ffffff; --muted: #adc0d2;
      --accent: #22d3ee; --accent-soft: #07293a; --brand: #c9a227; --on-brand: #020b18;
      --warning: #fbbf24; --warning-soft: rgba(251, 191, 36, .08); --warning-line: rgba(251, 191, 36, .45);
      --danger: #f87171; --code: #e18bb7; --flow: rgba(173, 192, 210, .45);
      --glow-1: rgba(34, 211, 238, .10); --glow-2: rgba(201, 162, 39, .08);
    }
    @media (prefers-color-scheme: light) {
      svg {
        --bg: #eef2f7; --surface: #ffffff; --elevated: #f1f5f9; --line: rgba(11, 26, 46, .09); --divider: #dbe2ea;
        --text: #020617; --muted: #475569;
        --accent: #0891b2; --accent-soft: #e0f2fe; --brand: #f5c518; --on-brand: #0f172a;
        --warning: #b45309; --warning-soft: rgba(217, 119, 6, .07); --warning-line: rgba(217, 119, 6, .45);
        --danger: #dc2626; --code: #b0457c; --flow: rgba(71, 85, 105, .45);
        --glow-1: rgba(8, 145, 178, .07); --glow-2: rgba(245, 197, 24, .09);
      }
    }
    text { font-family: Geist, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; fill: var(--text); }
    .mono, .pill-t, .code { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .bg { fill: var(--bg); }
    .card { fill: var(--surface); stroke: var(--line); stroke-width: 1; }
    .row { fill: var(--elevated); stroke: var(--line); stroke-width: 1; }
    .tile { fill: var(--elevated); stroke: var(--line); stroke-width: 1; }
    .ico { fill: none; stroke: var(--accent); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .ico-warn { fill: none; stroke: var(--warning); stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
    .brand { fill: var(--brand); }
    .brand-t { fill: var(--on-brand); font-size: 21px; font-weight: 600; }
    .h1 { font-size: 17px; font-weight: 600; }
    .h { font-size: 15px; font-weight: 600; }
    .d { font-size: 12.5px; fill: var(--muted); }
    .sec { font-size: 10.5px; font-weight: 500; letter-spacing: .09em; fill: var(--muted); }
    .sec-v { font-size: 10.5px; font-weight: 500; letter-spacing: .09em; fill: var(--accent); }
    .mono { font-size: 13.5px; }
    .code { font-size: 11px; fill: var(--code); }
    .pill { fill: var(--elevated); }
    .pill-t { font-size: 11px; fill: var(--muted); }
    .link { fill: var(--accent-soft); }
    .link-t { font-size: 11.5px; font-weight: 500; fill: var(--accent); }
    .dot { fill: var(--brand); }
    .divider { stroke: var(--divider); stroke-width: 1; }
    .knob { fill: var(--surface); stroke: var(--line); }
    .flow { fill: none; stroke: var(--flow); stroke-width: 1.5; }
    .flow-v { fill: none; stroke: var(--accent); stroke-width: 1.6; }
    .dash { fill: none; stroke: var(--flow); stroke-width: 1.4; stroke-dasharray: 4 4; }
    .deny { fill: none; stroke: var(--danger); stroke-width: 1.5; stroke-dasharray: 5 4; }
    .deny-t { font-size: 11.5px; font-weight: 500; fill: var(--danger); }
    .warn-box { fill: var(--warning-soft); stroke: var(--warning-line); stroke-width: 1; }
    .warn-t { font-size: 11.5px; fill: var(--warning); }
    .head { fill: var(--flow); } .head-v { fill: var(--accent); } .head-d { fill: var(--danger); }
    .g1 { stop-color: var(--glow-1); } .g1-end { stop-color: var(--glow-1); stop-opacity: 0; }
    .g2 { stop-color: var(--glow-2); } .g2-end { stop-color: var(--glow-2); stop-opacity: 0; }
  </style>
  <defs>
    <marker id="av" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse"><path class="head-v" d="M0,0 L10,5 L0,10 z"/></marker>
    <radialGradient id="glow1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(240 20) scale(520 300)">
      <stop offset="0" class="g1"/><stop offset="1" class="g1-end"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(820 252) scale(480 280)">
      <stop offset="0" class="g2"/><stop offset="1" class="g2-end"/>
    </radialGradient>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14a6.5 6.5 0 0 1 3.5 6"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></symbol>
  </defs>

  <rect class="bg" width="920" height="262" rx="18"/>
  <rect fill="url(#glow1)" width="920" height="262" rx="18"/>
  <rect fill="url(#glow2)" width="920" height="262" rx="18"/>

  <rect class="card" x="28" y="26" width="170" height="210" rx="16"/>
  <rect class="tile" x="46" y="44" width="36" height="36" rx="10"/>
  <use href="#i-user" class="ico" x="54" y="52" width="20" height="20"/>
  <text class="h" x="94" y="59">Clients</text>
  <text class="d" x="94" y="76">authenticated</text>
  <line class="divider" x1="46" y1="94" x2="180" y2="94"/>
  <rect class="row" x="46" y="112" width="134" height="34" rx="10"/>
  <text class="mono" x="60" y="134">alice</text>
  <rect class="row" x="46" y="166" width="134" height="34" rx="10"/>
  <text class="mono" x="60" y="188">bob</text>
  <rect class="card" x="248" y="26" width="180" height="210" rx="16"/>
  <rect class="tile" x="266" y="44" width="36" height="36" rx="10"/>
  <use href="#i-users" class="ico" x="274" y="52" width="20" height="20"/>
  <text class="h" x="314" y="59">Groups</text>
  <text class="d" x="314" y="76">clients + roles</text>
  <line class="divider" x1="266" y1="94" x2="410" y2="94"/>
  <rect class="row" x="266" y="112" width="144" height="34" rx="10"/>
  <text class="mono" x="280" y="134">producers</text>
  <rect class="row" x="266" y="166" width="144" height="34" rx="10"/>
  <text class="mono" x="280" y="188">admins</text>
  <rect class="card" x="478" y="26" width="414" height="210" rx="16"/>
  <rect class="tile" x="496" y="44" width="36" height="36" rx="10"/>
  <use href="#i-shield" class="ico" x="504" y="52" width="20" height="20"/>
  <text class="h" x="544" y="59">Roles</text>
  <text class="d" x="544" y="76">named lists of ACLs</text>
  <line class="divider" x1="496" y1="94" x2="874" y2="94"/>
  <rect class="row" x="496" y="107" width="378" height="44" rx="10"/>
  <text class="mono" x="510" y="134">orders-producer</text>
  <rect class="pill" x="650" y="119" width="170" height="20" rx="6"/>
  <circle class="dot" cx="661" cy="129" r="3"/><text class="pill-t" x="670" y="133">WRITE topic orders</text>
  <rect class="row" x="496" y="161" width="378" height="44" rx="10"/>
  <text class="mono" x="510" y="188">admin</text>
  <rect class="pill" x="580" y="173" width="122" height="20" rx="6"/>
  <circle class="dot" cx="591" cy="183" r="3"/><text class="pill-t" x="600" y="187">CREATE cluster</text>
  <rect class="pill" x="710" y="173" width="122" height="20" rx="6"/>
  <circle class="dot" cx="721" cy="183" r="3"/><text class="pill-t" x="730" y="187">DELETE cluster</text>
  <text class="d" x="496" y="226">Everything else: denied. A matching DENY always wins.</text>

  <path class="flow-v" d="M184,129 H262" marker-end="url(#av)"/>
  <path class="flow-v" d="M184,183 H262" marker-end="url(#av)"/>
  <path class="flow-v" d="M414,129 H492" marker-end="url(#av)"/>
  <path class="flow-v" d="M414,183 H492" marker-end="url(#av)"/>
</svg>
